[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbd-spmis"
version = "0.2.1"
description = "Privacy-by-Design control plane and reference Social Protection MIS: purpose-bound authorization, selective disclosure, tokenized identity, tamper-evident audit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "nahmedpsu" }]
keywords = ["privacy-by-design", "social-protection", "policy-as-code", "opa", "data-minimization", "govtech", "digital-public-goods"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "cryptography>=42",
  "jsonschema>=4.21",
  "typer>=0.12",
  "anyio>=4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "openapi-spec-validator>=0.7",
]
postgres = ["psycopg[binary]>=3.1"]
# openIMIS backend module (graphene middleware) and the privacy gateway (GraphQL parsing)
openimis = ["graphene>=2.1", "django>=4.2"]
gateway = ["graphql-core>=3.2"]

[project.scripts]
pbd-spmis = "pbd_spmis.cli:app"

[project.urls]
Homepage = "https://github.com/nahmedpsu/PbD-for-SPMIS"
Documentation = "https://github.com/nahmedpsu/PbD-for-SPMIS/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbd_spmis = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:pbd_spmis.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "integrations/openimis/openimis-be-pbd_py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603"]
"scripts/*" = ["S"]
"src/pbd_spmis/common/errors.py" = ["N818"]
"src/pbd_spmis/cli.py" = ["S603"]
"tests/test_openimis_module.py" = ["N805"]
# integration runner: seeded test credentials, long assertion lines
"integrations/openimis/validation/*" = ["S106", "E501", "F841"]
