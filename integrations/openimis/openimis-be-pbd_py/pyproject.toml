[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openimis-be-pbd"
version = "0.1.0"
description = "openIMIS backend module that enforces Privacy-by-Design (purpose-bound, attribute-level release) through the PbD-SPMIS control plane."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "pbd-spmis>=0.1.0",
  "graphene>=2.1",
  "django>=4.2",
  "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pbd*"]
