openapi: 3.1.0
info:
  title: PbD-SPMIS Retention Engine
  version: 0.2.0
  x-privacy-headers:
  - X-Purpose
  - X-Program
  - X-Correlation-ID
  - X-Channel
  - X-Device-Trust
  - X-Case-ID
  - X-Break-Glass-Grant
  x-response-headers:
  - X-Decision-ID
  - X-Policy-Version
  - X-Obligations
  x-source: generated by scripts/export_contracts.py; do not edit by hand
paths:
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
  /v1/schedules:
    post:
      summary: Register
      operationId: register_v1_schedules_post
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Register V1 Schedules Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Schedules
      operationId: list_schedules_v1_schedules_get
      parameters:
      - name: due_within_days
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Due Within Days
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Schedules V1 Schedules Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/run:
    post:
      summary: Run
      operationId: run_v1_run_post
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Run V1 Run Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RunIn:
      properties:
        dry_run:
          type: boolean
          title: Dry Run
          default: true
        as_of:
          anyOf:
          - type: string
          - type: 'null'
          title: As Of
        limit:
          type: integer
          title: Limit
          default: 500
      type: object
      title: RunIn
    ScheduleIn:
      properties:
        service:
          type: string
          title: Service
        record_type:
          type: string
          title: Record Type
        record_ref:
          type: string
          title: Record Ref
        program:
          type: string
          title: Program
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
      type: object
      required:
      - service
      - record_type
      - record_ref
      - program
      title: ScheduleIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service or user token. Development tokens are HS256; production
        uses OIDC.
  parameters:
    XPurpose:
      name: X-Purpose
      in: header
      required: false
      schema:
        type: string
      description: Registered purpose (catalog/purposes.yaml). Required on sensitive
        endpoints.
    XProgram:
      name: X-Program
      in: header
      required: false
      schema:
        type: string
      description: Program the request is made for (see catalog/programs.yaml).
    XCorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: Correlation id propagated to downstream calls and audit events.
    XChannel:
      name: X-Channel
      in: header
      required: false
      schema:
        type: string
      description: Access channel (api, portal, assisted, mobile).
    XDeviceTrust:
      name: X-Device-Trust
      in: header
      required: false
      schema:
        type: string
      description: 'Device/session trust asserted by the access layer: low, managed
        or high.'
    XCaseID:
      name: X-Case-ID
      in: header
      required: false
      schema:
        type: string
      description: Case the actor is working on; required by case-scoped purposes.
    XBreakGlassGrant:
      name: X-Break-Glass-Grant
      in: header
      required: false
      schema:
        type: string
      description: Active break-glass grant id for the emergency_protection purpose.
  headers:
    X-Decision-ID:
      schema:
        type: string
      description: Policy decision id recorded in the audit store.
    X-Policy-Version:
      schema:
        type: string
      description: Catalogue/policy version used for the decision.
    X-Obligations:
      schema:
        type: string
      description: Comma-separated obligations the caller must honour, e.g. no_export.
security:
- bearerAuth: []
