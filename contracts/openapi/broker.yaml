openapi: 3.1.0
info:
  title: PbD-SPMIS Data Exchange Broker
  version: 0.2.0
  x-privacy-headers:
  - X-Purpose
  - X-Program
  - X-Correlation-ID
  - X-Channel
  - X-Device-Trust
  - X-Case-ID
  - X-Break-Glass-Grant
  x-response-headers:
  - X-Decision-ID
  - X-Policy-Version
  - X-Obligations
  x-source: generated by scripts/export_contracts.py; do not edit by hand
paths:
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
  /v1/verify:
    post:
      summary: Verify
      operationId: verify_v1_verify_post
      parameters:
      - name: X-Purpose
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Purpose
      - name: X-Program
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Program
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      - name: X-Channel
        in: header
        required: false
        schema:
          type: string
          default: api
          title: X-Channel
      - name: X-Device-Trust
        in: header
        required: false
        schema:
          type: string
          default: managed
          title: X-Device-Trust
      - name: X-Case-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Case-Id
      - name: X-Break-Glass-Grant
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Break-Glass-Grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Verify V1 Verify Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/internal/retention:
    post:
      summary: Retention
      operationId: retention_v1_internal_retention_post
      parameters:
      - name: X-Purpose
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Purpose
      - name: X-Program
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Program
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      - name: X-Channel
        in: header
        required: false
        schema:
          type: string
          default: api
          title: X-Channel
      - name: X-Device-Trust
        in: header
        required: false
        schema:
          type: string
          default: managed
          title: X-Device-Trust
      - name: X-Case-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Case-Id
      - name: X-Break-Glass-Grant
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Break-Glass-Grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Retention V1 Internal Retention Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RetentionIn:
      properties:
        record_type:
          type: string
          title: Record Type
        record_ref:
          type: string
          title: Record Ref
        action:
          type: string
          title: Action
      type: object
      required:
      - record_type
      - record_ref
      - action
      title: RetentionIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerifyIn:
      properties:
        person_token:
          type: string
          title: Person Token
        checks:
          items:
            type: string
          type: array
          minItems: 1
          title: Checks
        params:
          additionalProperties: true
          type: object
          title: Params
      type: object
      required:
      - person_token
      - checks
      title: VerifyIn
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service or user token. Development tokens are HS256; production
        uses OIDC.
  parameters:
    XPurpose:
      name: X-Purpose
      in: header
      required: false
      schema:
        type: string
      description: Registered purpose (catalog/purposes.yaml). Required on sensitive
        endpoints.
    XProgram:
      name: X-Program
      in: header
      required: false
      schema:
        type: string
      description: Program the request is made for (see catalog/programs.yaml).
    XCorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: Correlation id propagated to downstream calls and audit events.
    XChannel:
      name: X-Channel
      in: header
      required: false
      schema:
        type: string
      description: Access channel (api, portal, assisted, mobile).
    XDeviceTrust:
      name: X-Device-Trust
      in: header
      required: false
      schema:
        type: string
      description: 'Device/session trust asserted by the access layer: low, managed
        or high.'
    XCaseID:
      name: X-Case-ID
      in: header
      required: false
      schema:
        type: string
      description: Case the actor is working on; required by case-scoped purposes.
    XBreakGlassGrant:
      name: X-Break-Glass-Grant
      in: header
      required: false
      schema:
        type: string
      description: Active break-glass grant id for the emergency_protection purpose.
  headers:
    X-Decision-ID:
      schema:
        type: string
      description: Policy decision id recorded in the audit store.
    X-Policy-Version:
      schema:
        type: string
      description: Catalogue/policy version used for the decision.
    X-Obligations:
      schema:
        type: string
      description: Comma-separated obligations the caller must honour, e.g. no_export.
security:
- bearerAuth: []
