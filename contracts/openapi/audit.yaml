openapi: 3.1.0
info:
  title: PbD-SPMIS Audit Store
  version: 0.1.0
  x-privacy-headers:
  - X-Purpose
  - X-Program
  - X-Correlation-ID
  - X-Channel
  - X-Device-Trust
  - X-Case-ID
  - X-Break-Glass-Grant
  x-response-headers:
  - X-Decision-ID
  - X-Policy-Version
  - X-Obligations
  x-source: generated by scripts/export_contracts.py; do not edit by hand
paths:
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
  /v1/events:
    post:
      summary: Write Event
      operationId: write_event_v1_events_post
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Write Event V1 Events Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Events
      operationId: list_events_v1_events_get
      parameters:
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Type
      - name: subject_token
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Token
      - name: actor_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Id
      - name: outcome
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Outcome
      - name: correlation_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
      - name: decision_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          default: 100
          title: Limit
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Events V1 Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/chain/verify:
    get:
      summary: Verify Chain
      operationId: verify_chain_v1_chain_verify_get
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Verify Chain V1 Chain Verify Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/metrics:
    get:
      summary: Metrics
      operationId: metrics_v1_metrics_get
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Metrics V1 Metrics Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    EventIn:
      properties:
        event_type:
          type: string
          title: Event Type
        service:
          type: string
          title: Service
        actor_id:
          type: string
          title: Actor Id
        actor_role:
          type: string
          title: Actor Role
          default: ''
        actor_agency:
          type: string
          title: Actor Agency
          default: ''
        purpose:
          anyOf:
          - type: string
          - type: 'null'
          title: Purpose
        program:
          anyOf:
          - type: string
          - type: 'null'
          title: Program
        subject_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject Token
        attributes:
          items:
            type: string
          type: array
          title: Attributes
        outcome:
          type: string
          title: Outcome
        decision_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Id
        reason_codes:
          items:
            type: string
          type: array
          title: Reason Codes
        obligations:
          items:
            type: string
          type: array
          title: Obligations
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        details:
          additionalProperties: true
          type: object
          title: Details
      type: object
      required:
      - event_type
      - service
      - actor_id
      - outcome
      title: EventIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service or user token. Development tokens are HS256; production
        uses OIDC.
  parameters:
    XPurpose:
      name: X-Purpose
      in: header
      required: false
      schema:
        type: string
      description: Registered purpose (catalog/purposes.yaml). Required on sensitive
        endpoints.
    XProgram:
      name: X-Program
      in: header
      required: false
      schema:
        type: string
      description: Program the request is made for (see catalog/programs.yaml).
    XCorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: Correlation id propagated to downstream calls and audit events.
    XChannel:
      name: X-Channel
      in: header
      required: false
      schema:
        type: string
      description: Access channel (api, portal, assisted, mobile).
    XDeviceTrust:
      name: X-Device-Trust
      in: header
      required: false
      schema:
        type: string
      description: 'Device/session trust asserted by the access layer: low, managed
        or high.'
    XCaseID:
      name: X-Case-ID
      in: header
      required: false
      schema:
        type: string
      description: Case the actor is working on; required by case-scoped purposes.
    XBreakGlassGrant:
      name: X-Break-Glass-Grant
      in: header
      required: false
      schema:
        type: string
      description: Active break-glass grant id for the emergency_protection purpose.
  headers:
    X-Decision-ID:
      schema:
        type: string
      description: Policy decision id recorded in the audit store.
    X-Policy-Version:
      schema:
        type: string
      description: Catalogue/policy version used for the decision.
    X-Obligations:
      schema:
        type: string
      description: Comma-separated obligations the caller must honour, e.g. no_export.
security:
- bearerAuth: []
