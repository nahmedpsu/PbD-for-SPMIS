openapi: 3.1.0
info:
  title: PbD-SPMIS Policy Decision Point
  version: 0.2.1
  x-privacy-headers:
  - X-Purpose
  - X-Program
  - X-Correlation-ID
  - X-Channel
  - X-Device-Trust
  - X-Case-ID
  - X-Break-Glass-Grant
  x-response-headers:
  - X-Decision-ID
  - X-Policy-Version
  - X-Obligations
  x-source: generated by scripts/export_contracts.py; do not edit by hand
paths:
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Healthz Get
  /v1/policy:
    get:
      summary: Policy Info
      operationId: policy_info_v1_policy_get
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Policy Info V1 Policy Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/catalog:
    get:
      summary: Catalog View
      description: Non-sensitive catalogue view for SDKs and adapters (bands, thresholds,
        classes).
      operationId: catalog_view_v1_catalog_get
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Catalog View V1 Catalog Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/decisions:
    post:
      summary: Decide
      operationId: decide_v1_decisions_post
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Correlation-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActorIn:
      properties:
        id:
          type: string
          title: Id
        role:
          type: string
          title: Role
        agency:
          type: string
          title: Agency
          default: ''
        office:
          type: string
          title: Office
          default: ''
        programs:
          items:
            type: string
          type: array
          title: Programs
        cases:
          items:
            type: string
          type: array
          title: Cases
        amr:
          items:
            type: string
          type: array
          title: Amr
        is_service:
          type: boolean
          title: Is Service
          default: false
      type: object
      required:
      - id
      - role
      title: ActorIn
    DecisionRequest:
      properties:
        actor:
          $ref: '#/components/schemas/ActorIn'
        subject:
          $ref: '#/components/schemas/SubjectIn'
        program:
          type: string
          title: Program
        purpose:
          type: string
          title: Purpose
        action:
          type: string
          title: Action
          default: read
        attributes:
          items:
            type: string
          type: array
          title: Attributes
        context:
          additionalProperties: true
          type: object
          title: Context
      type: object
      required:
      - actor
      - program
      - purpose
      title: DecisionRequest
    DecisionResponse:
      properties:
        decision_id:
          type: string
          title: Decision Id
        allow:
          type: boolean
          title: Allow
        policy_version:
          type: string
          title: Policy Version
        engine:
          type: string
          title: Engine
        release:
          additionalProperties:
            type: string
          type: object
          title: Release
        obligations:
          items:
            type: string
          type: array
          title: Obligations
        reason_codes:
          items:
            type: string
          type: array
          title: Reason Codes
        attribute_reasons:
          additionalProperties:
            type: string
          type: object
          title: Attribute Reasons
        evaluated_at:
          type: string
          title: Evaluated At
      type: object
      required:
      - decision_id
      - allow
      - policy_version
      - engine
      - release
      - obligations
      - reason_codes
      - attribute_reasons
      - evaluated_at
      title: DecisionResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SubjectIn:
      properties:
        person_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Person Token
        program_relationship:
          items:
            type: string
          type: array
          title: Program Relationship
      type: object
      title: SubjectIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service or user token. Development tokens are HS256; production
        uses OIDC.
  parameters:
    XPurpose:
      name: X-Purpose
      in: header
      required: false
      schema:
        type: string
      description: Registered purpose (catalog/purposes.yaml). Required on sensitive
        endpoints.
    XProgram:
      name: X-Program
      in: header
      required: false
      schema:
        type: string
      description: Program the request is made for (see catalog/programs.yaml).
    XCorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: Correlation id propagated to downstream calls and audit events.
    XChannel:
      name: X-Channel
      in: header
      required: false
      schema:
        type: string
      description: Access channel (api, portal, assisted, mobile).
    XDeviceTrust:
      name: X-Device-Trust
      in: header
      required: false
      schema:
        type: string
      description: 'Device/session trust asserted by the access layer: low, managed
        or high.'
    XCaseID:
      name: X-Case-ID
      in: header
      required: false
      schema:
        type: string
      description: Case the actor is working on; required by case-scoped purposes.
    XBreakGlassGrant:
      name: X-Break-Glass-Grant
      in: header
      required: false
      schema:
        type: string
      description: Active break-glass grant id for the emergency_protection purpose.
  headers:
    X-Decision-ID:
      schema:
        type: string
      description: Policy decision id recorded in the audit store.
    X-Policy-Version:
      schema:
        type: string
      description: Catalogue/policy version used for the decision.
    X-Obligations:
      schema:
        type: string
      description: Comma-separated obligations the caller must honour, e.g. no_export.
security:
- bearerAuth: []
