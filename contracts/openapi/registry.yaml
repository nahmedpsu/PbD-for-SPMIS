components:
  schemas:
    Address:
      properties:
        street:
          type: string
          title: Street
          default: ''
        district:
          type: string
          title: District
          default: ''
        region:
          type: string
          title: Region
          default: ''
      type: object
      title: Address
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PersonIn:
      properties:
        person_token:
          type: string
          title: Person Token
        household_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Household Token
        income:
          anyOf:
          - type: number
          - type: 'null'
          title: Income
        household_size:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Household Size
        disability_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Disability Status
        employment_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Employment Status
        vulnerability_attributes:
          items:
            type: string
          type: array
          title: Vulnerability Attributes
        address:
          $ref: '#/components/schemas/Address'
      type: object
      required:
      - person_token
      title: PersonIn
    PersonUpdate:
      properties:
        income:
          anyOf:
          - type: number
          - type: 'null'
          title: Income
        household_size:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Household Size
        disability_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Disability Status
        employment_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Employment Status
        vulnerability_attributes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Vulnerability Attributes
        address:
          anyOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
      type: object
      title: PersonUpdate
    RelationshipIn:
      properties:
        program:
          type: string
          title: Program
      type: object
      required:
      - program
      title: RelationshipIn
    RetentionIn:
      properties:
        record_type:
          type: string
          title: Record Type
        record_ref:
          type: string
          title: Record Ref
        action:
          type: string
          title: Action
      type: object
      required:
      - record_type
      - record_ref
      - action
      title: RetentionIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service or user token. Development tokens are HS256; production
        uses OIDC.
  parameters:
    XPurpose:
      name: X-Purpose
      in: header
      required: false
      schema:
        type: string
      description: Registered purpose (catalog/purposes.yaml). Required on sensitive
        endpoints.
    XProgram:
      name: X-Program
      in: header
      required: false
      schema:
        type: string
      description: Program the request is made for (see catalog/programs.yaml).
    XCorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: Correlation id propagated to downstream calls and audit events.
    XChannel:
      name: X-Channel
      in: header
      required: false
      schema:
        type: string
      description: Access channel (api, portal, assisted, mobile).
    XDeviceTrust:
      name: X-Device-Trust
      in: header
      required: false
      schema:
        type: string
      description: 'Device/session trust asserted by the access layer: low, managed
        or high.'
    XCaseID:
      name: X-Case-ID
      in: header
      required: false
      schema:
        type: string
      description: Case the actor is working on; required by case-scoped purposes.
    XBreakGlassGrant:
      name: X-Break-Glass-Grant
      in: header
      required: false
      schema:
        type: string
      description: Active break-glass grant id for the emergency_protection purpose.
  headers:
    X-Decision-ID:
      schema:
        type: string
      description: Policy decision id recorded in the audit store.
    X-Policy-Version:
      schema:
        type: string
      description: Catalogue/policy version used for the decision.
    X-Obligations:
      schema:
        type: string
      description: Comma-separated obligations the caller must honour, e.g. no_export.
security:
- bearerAuth: []
