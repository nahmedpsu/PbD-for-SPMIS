name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint, tests, conformance (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v1.9.0/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Validate catalogue, bundle and contracts
        run: |
          pbd-spmis catalog validate
          python scripts/build_bundle.py --check
          python scripts/export_contracts.py --check
      - name: Rego policy tests
        run: |
          opa check --v1-compatible policy/rego
          opa test --v1-compatible policy/rego policy/bundle -v
      - name: Python tests (embedded engine, Rego via opa eval, services end-to-end)
        run: python -m pytest -q
      - name: Demo walkthrough
        run: pbd-spmis demo --json > demo.json && python -c "import json; s=json.load(open('demo.json')); print(len(s), 'steps')"

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pbd-spmis:ci
          load: true
      - name: Smoke test the image
        run: |
          docker run -d --name spmis -p 8000:8000 pbd-spmis:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/healthz && break; sleep 1; done
          curl -sf http://localhost:8000/ | python -c "import json,sys; d=json.load(sys.stdin); assert len(d['services'])==10; print(d['services'].keys())"
          docker logs spmis | tail -20
